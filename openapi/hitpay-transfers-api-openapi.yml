              schema:
                type: object
                properties:
                  id:
                    type: string
                  beneficiary:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                      country:
                        type: string
                      currency:
                        type: string
                      transfer_method:
                        type: string
                      holder_name:
                        type: string
                      holder_type:
                        type: string
                      account_number:
                        type: string
                      bank_name:
                        type: string
                      bank_id:
                        type: string
                      email:
                        type:
                        - string
                        - 'null'
                      bank_routing_number:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - status
                    - country
                    - currency
                    - transfer_method
                    - holder_name
                    - holder_type
                    - account_number
                    - bank_name
                    - bank_id
                    - email
                    - bank_routing_number
                    - created_at
                    - updated_at
                  payment_currency:
                    type: string
                  payment_amount:
                    type: number
                  source_currency:
                    type: string
                  source_amount:
                    type: number
                  exchange_rate:
                    type: string
                  fee:
                    type: object
                    properties:
                      amount:
                        type: number
                      currency:
                        type: string
                      paid_by:
                        type: string
                        enum:
                        - payer
                        - beneficiary
                    required:
                    - amount
                    - currency
                    - paid_by
                  status:
                    type: string
                    enum:
                    - scheduled
                    - processing
                    - paid
                    - failed
                    - canceled
                  created_at:
                    type: string
                required:
                - id
                - beneficiary
                - payment_currency
                - payment_amount
                - source_currency
                - source_amount
                - exchange_rate
                - fee
                - status
                - created_at
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: The beneficiary id field is required when beneficiary is not present. (and 4 more errors)
                    errors:
                      beneficiary_id:
                      - The beneficiary id field is required when beneficiary is not present.
                      beneficiary:
                      - The beneficiary field is required when beneficiary id is not present.
                      source_currency:
                      - The source currency field is required.
                      source_amount:
                      - The source amount field is required when payment amount is not present.
                      payment_amount:
                      - The payment amount field is required when source amount is not present.
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "curl --location 'https://api.sandbox.hit-pay.com/v1/transfers' \\n--header 'X-BUSINESS-API-KEY: 9011d0e1e03c1e2d79cdcf1fd7147eaa6d339e4ba5e42df38d8b495e7ed8e9fc' \\\n --header 'X-Requested-With: XMLHttpRequest' \\\n --form "
          name: Example request
        samples-languages:
        - curl
      tags:
      - Transfers
