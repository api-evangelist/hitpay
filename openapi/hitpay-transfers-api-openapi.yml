      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - beneficiary_id
              - source_currency
              properties:
                beneficiary_id:
                  type: string
                  description: The Beneficiary id
                  examples: 9ad4789a-c864-48a6-a657-7fdfc57ba1fc
                source_currency:
                  type: string
                  example: sgd
                  description: 'The supported currency. '
                source_amount:
                  type: number
                  minimum: 1
                  description: The amount to be transferred. Only required if 'payment_amount' is not set.
                  example: 112.42
                  format: double
                payment_amount:
                  type: number
                  minimum: 1
                  description: The amount to be transferred. Only required if 'source_amount' is not set.
                  example: 10000.5
                  format: double
            examples:
              Result:
