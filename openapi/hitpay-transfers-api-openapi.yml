    post:
      summary: Create a new transfer
      description: Create a new transfer
      operationId: create-transfer
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                beneficiary:
                  type: object
                  description: The beneficiary information. Only required if 'beneficiary_id' is not set. The payload depends on the country and payment method. Please refer `Create Beneficiary` for addtional fields
                  externalDocs:
                    description: More info here
                    url: https://docs.hitpayapp.com/apis/payout/create-beneficiary
                  properties:
                    country:
                      type: string
                      description: The country code
                      enum:
                      - sg
                      - bd
                      - ph
                      - vn
                      - au
                    currency:
                      type: string
                      description: The currency code
                      enum:
                      - sgd
                      - bdt
                      - php
                      - vnd
                      - aud
                    transfer_method:
                      type: string
                      description: The transfer method
                    transfer_type:
                      type: string
                      description: The transfer type
                      enum:
                      - local
                      example: local
                    holder_type:
                      type: string
                      description: The Holder Type
                      enum:
                      - individual
                      example: individual
                    holder_name:
                      type: string
                      required: true
                      description: The Holder Name
                      example: John Doe
                      maxLength: 255
                beneficiary_id:
                  type: string
                  required: 'true'
                  format: uuid
                  description: The Beneficiary id. Only required if 'beneficiary' is not set.
                source_currency:
                  type: string
                  example: sgd
                  description: It is beneficiary bank account currency.
                source_amount:
                  type: number
                  minimum: 1
                  description: The amount to be transferred. Only required if 'payment_amount' is not set.
                  example: 112.42
                  format: double
                payment_amount:
                  type: number
                  minimum: 1
                  description: The amount to be transferred. Only required if `source_amount` is not set.
                  example: 10000.5
                  format: double
                remitter_id:
                  type: string
                  description: The remitter id. Only pass either `remitter` or `remitter_id`.
                  example: 9b294222-3a53-427f-9393-95dc6d63ee6c
                remitter:
                  type: object
                  description: The remitter information. Only pass either `remitter` or `remitter_id`.
                  properties:
                    entity_type:
                      type: string
                      example: individual
                      enum:
                      - individual
                      - company
                    full_name:
                      type: string
                      maxLength: 255
                      example: John Doe
                    id_number:
                      type: string
                      maxLength: 255
                      example: FB123456
                    id_type:
                      type: string
                      example: passport
                      enum:
                      - passport
                      - national_id
                      - driving_license
                    date_of_birth:
                      type: string
                      maxLength: 255
                      example: '1990-01-01'
                      format: date
                    place_of_birth:
                      type: string
                      example: Singapore
                    nationality:
                      type: string
                      description: 2 letter code, lowercase
                      minLength: 2
                      maxLength: 2
                      example: sg
                    contact_number:
                      type: string
                      maxLength: 100
                      example: '+6598765432'
                    email:
                      type: string
                      maxLength: 255
                      example: abc@gmail.com
                    address:
                      type: object
                      properties:
                        street_address:
                          type: string
                          maxLength: 255
                          example: 1 Keong Saik Road
                        city:
                          type: string
                          maxLength: 100
                          example: Singapore
                        state:
                          type: string
                          maxLength: 100
                          example: SG
                        postal_code:
                          type: string
                          maxLength: 30
                          example: 089109
                        country:
                          type: string
                          description: 2 letter code, lowercase
                          minLength: 2
                          maxLength: 2
                          example: sg
                      required:
                      - street
                      - city
                      - state
                      - postcode
                    company_name:
                      type: string
                      maxLength: 255
                      description: Only required if entity_type is company
                      example: HitPay Pte Ltd
                remark:
                  type: string
                  maxLength: 120
                  description: Transfer note for internal use only
                reference:
                  type: string
                  maxLength: 120
                  description: The reference for the transfer
            examples:
              Result:
                value:
                  beneficiary_id: 9e64eb6c-90dd-45e0-afaf-bd9fa0253674
                  source_currency: sgd
                  source_amount: 112.42
                  payment_amount: 10000.5
                  remitter:
                    entity_type: company
                    full_name: Test Sender
                    id_number: FB123456
                    id_type: passport
                    date_of_birth: '1990-10-28'
                    place_of_birth: Singapore
                    nationality: sg
                    contact_number: '+6598644718'
                    email: email@gmail.com
                    address:
                      street_address: 1 Keong Saik Road
                      city: Singapore
                      state: Singapore
                      postal_code: 089109
                      country: sg
                    company_name: HitPay
      responses:
        '201':
          description: '201'
          content:
