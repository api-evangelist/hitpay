openapi: 3.1.1
info:
  title: HitPay Account Status Transfers API
  description: 'Accept PayNow, FPX, QRIS, GrabPay, cards, and 40+ payment methods with a single API. Production base URL: https://api.hit-pay.com, Sandbox: https://api.sandbox.hit-pay.com'
  version: '1.0'
servers:
- url: https://api.hit-pay.com
  description: Production
- url: https://api.sandbox.hit-pay.com
  description: Sandbox
tags:
- name: Transfers
paths:
  /v1/transfers:
    get:
      summary: Get list of transfers
      description: Get list of transfers
      operationId: get-transfers
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      - name: beneficiary_id
        in: query
        description: The Beneficiary id
        schema:
          type: string
          format: uuid
      - name: keywords
        description: The keywords to search by ID, beneficiary name and remark
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        description: The status of the transfer
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - processing
          - paid
          - failed
          - canceled
      - name: per_page
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                    - id: 9ec02ec7-a121-457f-9efc-1c4610fbe4e6
                      beneficiary:
                        id: 9ec01865-7af1-4937-813d-7801912d2cd1
                        status: approved
