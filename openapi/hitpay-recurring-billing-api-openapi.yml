        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      - name: recurring_billing_id
        in: path
        schema:
          type: string
          'format:': uuid
        required: true
      responses:
