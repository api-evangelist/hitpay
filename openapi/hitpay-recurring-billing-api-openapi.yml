                    default: 0
                  status:
                    type: string
                    examples:
                    - active
                  send_email:
                    type: integer
                    examples:
                    - 0
                    default: 0
                  save_card:
                    type: integer
                    examples:
                    - 0
                    default: 0
                  redirect_url:
                    type: string
                    examples:
                    - https://newexamaple.com/completed
                  payment_methods:
                    type: array
                    items:
                      type: string
                      examples:
                      - giro
                  created_at:
                    type: string
                    examples:
                    - '2022-09-13T21:32:00'
                  updated_at:
                    type: string
                    examples:
                    - '2022-09-13T21:32:00'
                  expires_at: {}
                  url:
                    type: string
                    examples:
                    - https://securecheckout.sandbox.hit-pay.com/973ee344-6737-4897-9929-edbc9d7bf433/recurring-plan/9741164c-06a1-4dd7-a649-72cca8f9603a
        '422':
          description: '422'
          content:
            text/plain:
              examples:
