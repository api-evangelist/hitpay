openapi: 3.1.1
info:
  title: HitPay Account Status Charges API
  description: 'Accept PayNow, FPX, QRIS, GrabPay, cards, and 40+ payment methods with a single API. Production base URL: https://api.hit-pay.com, Sandbox: https://api.sandbox.hit-pay.com'
  version: '1.0'
servers:
- url: https://api.hit-pay.com
  description: Production
- url: https://api.sandbox.hit-pay.com
  description: Sandbox
tags:
- name: Charges
paths:
  /v1/charges/export:
    get:
      summary: Export Charges
      description: Export charges
      operationId: export-charges
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      - name: perPage
        in: query
        schema:
          type: integer
          format: int32
          default: 25
      - name: version
        in: query
        description: The order version.
        schema:
          type: string
          default: '1.0'
      - name: keywords
        in: query
        description: 'Search for fields: amount ,created_at ,id remark, customer_name'
        schema:
          type: string
      - name: before
        in: query
        description: It's optional field and it's charge_id
        schema:
          type: string
      - name: after
        in: query
        description: It's optional field and it's charge_id
        schema:
          type: string
      - name: payment_method
        in: query
        description: 'The payment methods: card, alipay, paypal_card.. etc.'
        schema:
          type: string
      - name: statuses[]
        in: query
        description: The statuses are in "completed" , "pending", "sent", "draft", "expired"
        schema:
          type: string
      - name: dateFrom
        in: query
        description: The from of created order
        schema:
          type: string
      - name: dateTo
        in: query
        description: The To of created order
        schema:
          type: string
      - name: with
        in: query
        description: 'If you want to display more charge and products objects. Example: charges,products'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content: {}
      deprecated: false
      tags:
      - Charges
  /v1/charges:
    get:
      summary: Get All Charges
      description: Get all charges
      operationId: get-all-charges
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      - name: per_page
        in: query
        schema:
          type: integer
          format: int32
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
          description: The cursor parameter accepts a next_cursor value obtained from the previous response's meta object (meta.next_cursor). Use this parameter to fetch the next page of results when implementing pagination.
      - name: keywords
        in: query
        description: 'Search for fields: amount ,charge_id ,customer_email, remark'
        schema:
          type: string
      - name: status
        in: query
        description: It's charge status
        schema:
          type: string
          enum:
          - succeeded
          - failed
          - refunded
      - name: location_ids
        in: query
        description: The location ids
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: user_ids
        in: query
        description: The user's id, support both uuid and number id
        schema:
          type: array
          items:
            type: string
      - name: statuses
        in: query
        description: It's charge status.
        schema:
          type: array
          items:
            type: string
            enum:
            - success
            - succeeded_manually
            - pending
            - failed
            - refunded
            - cancelled
            - partially_refunded
            - void
      - name: date_from
        in: query
        description: The from of created order
        schema:
          type: string
          example: '2024-10-05'
      - name: date_to
        in: query
        description: The to of created order
        schema:
          type: string
          example: '2024-10-05'
      - name: amount_from
        in: query
        description: The from of amount
        schema:
          type: number
          example: 100
      - name: amount_to
        in: query
        description: The to of amount
        schema:
          type: number
          example: 200
      - name: payment_request_id
        in: query
        description: The payment request id
        schema:
          type: string
          format: uuid
      - name: customer_id
        in: query
        description: The customer id
        schema:
          type: string
          format: uuid
      - name: payout_id
