                        order_id:
                          type:
                          - string
                          - 'null'
                        payout_id:
                          type:
                          - string
                          - 'null'
                        transfer_id:
                          type: string
                        debit:
                          type: number
                        credit:
                          type:
                          - number
                          - 'null'
                        currency:
                          type: string
                      required:
                      - datetime
                      - description
                      - charge_id
                      - order_id
                      - transfer_id
                      - currency
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: string
                      next_cursor:
                        type: string
                      prev_cursor: {}
                    required:
                    - per_page
                    - next_cursor
                    - prev_cursor
                required:
                - data
                - meta
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: The created at from does not match the format Y-m-d. (and 1 more error)
                    errors:
                      created_at_from:
                      - The created at from does not match the format Y-m-d.
                      created_at_to:
                      - The created at to must be a date after or equal to created at from.
              schema: {}
      deprecated: false
      tags:
      - Balances
  /v1/balances/{balance_provider}/transactions/export:
    post:
      summary: Export Balance Breakdown
      description: Export Balance Breakdown and the exported file will be included in attachment of sending email to the business's admin email. Currenly, we only support `Adyen` provider.
      operationId: export-transactions
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      - name: balance_provider
        in: path
        description: The balance provider. It only supports Adyen now.
        schema:
          type: string
          example: adyen
        required: true
      - name: created_at_from
        description: The start day of Adyen transaction in range.
        in: query
        schema:
          type: string
          example: '2025-05-21'
      - name: created_at_to
        description: 'The end day of Adyen transaction in range. Note: `created_at_to >= created_at_from`'
        in: query
        schema:
          type: string
          example: '2025-05-21'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: The created at from does not match the format Y-m-d. (and 1 more error)
                    errors:
                      created_at_from:
                      - The created at from does not match the format Y-m-d.
                      created_at_to:
                      - The created at to must be a date after or equal to created at from.
              schema: {}
      deprecated: false
      tags:
      - Balances
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
x-readme-fauxas: true
