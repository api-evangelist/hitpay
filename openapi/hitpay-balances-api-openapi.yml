openapi: 3.1.1
info:
  title: HitPay Account Status Balances API
  description: 'Accept PayNow, FPX, QRIS, GrabPay, cards, and 40+ payment methods with a single API. Production base URL: https://api.hit-pay.com, Sandbox: https://api.sandbox.hit-pay.com'
  version: '1.0'
servers:
- url: https://api.hit-pay.com
  description: Production
- url: https://api.sandbox.hit-pay.com
  description: Sandbox
tags:
- name: Balances
paths:
  /v1/balances:
    get:
      summary: Get Balances
      description: Get Balances
      operationId: get-balances
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - currency: sgd
                    wallets:
                      available: 2036.25
                      deposit: 0
                      pending: 94.1
                      reserve: 5913.65
                  - currency: usd
                    wallets:
                      available: 600
                      reserve: 0
              schema:
                type: array
                items:
                  type: object
                  properties:
                    currency:
                      type: string
                    wallets:
                      type: object
                      properties:
                        available:
                          type: number
                        deposit:
                          type: number
                        pending:
                          type: number
                        reserve:
                          type: number
                      required:
                      - available
                      - reserve
                  required:
                  - currency
                  - wallets
      deprecated: false
      tags:
      - Balances
  /v1/balances/{balance_provider}/transactions:
    get:
      summary: Get Balance Transactions
      description: Get Balance Transactions and it's only applicable for Singapore merchants with Cards (by Adyen) Balance.
      operationId: get-balance-transactions
      parameters:
      - name: X-BUSINESS-API-KEY
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: b286daabf9921b5a01a4621f026c111e046f8911feba212996c92159b98427d
      - name: balance_provider
        in: path
        description: The balance provider
        schema:
          type: string
          example: adyen
        required: true
      - name: created_at_from
        description: The start day of Adyen transaction in range.
        in: query
        schema:
          type: string
          example: '2025-05-21'
      - name: created_at_to
        description: 'The end day of Adyen transaction in range. Note: `created_at_to >= created_at_from`'
        in: query
        schema:
          type: string
          example: '2025-05-21'
      - name: cursor
        in: query
        description: It is used to fetch the next (or previous) set of results.
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: number
          default: 10
          maximum: 100
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    data:
                    - datetime: '2025-01-23T07:07:36+01:00'
                      description: 'Received for charge #9e08f05a-5374-4ffa-996c-1c8981f11df9'
                      charge_id: null
                      order_id: null
                      payout_id: null
                      transfer_id: 38E95Y65QHBT2SOX
                      debit: null
                      credit: 95.85
                      currency: SGD
                    - datetime: '2025-01-24T10:32:39+01:00'
                      description: 'Received for charge #9e0b3d23-7bf7-4e7c-945f-6b81641a851b'
                      charge_id: null
