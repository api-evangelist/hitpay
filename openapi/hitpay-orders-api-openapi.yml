                  description: The location id of the order
                  examples:
                  - 9ae46141-c930-4613-b5a0-241206b9c215
                customer_id:
                  type: string
                  description: The customer id of the order
                  examples:
                  - 9ae46141-c930-4613-b5a0-241206b9c215
                customer_pickup:
                  type: boolean
                  description: The customer pickup of the order
                  examples:
                  - true
                  default: true
                channel:
                  type: string
                  description: The channel of the order
                  examples:
                  - point_of_sale
                  default: point_of_sale
                business_user_id:
                  type: string
                  description: The business user id of the order
                  examples:
                  - '34'
                discount_reason:
                  type: string
                  description: The discount reason of the order
                  examples:
                  - Discount Reason
                discount_amount:
                  type: number
                  description: The discount amount of the order
                  examples:
                  - 10
                  default: 0
                version:
                  type: string
                  description: The version of the order
                  examples:
                  - '1.0'
                  default: '1.0'
              required:
              - amount
              - currency
              - remark
              - location_id
              - customer_id
              - customer_pickup
              - channel
              - business_user_id
              - discount_reason
              - discount_amount
