        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: The total amount of the order
                  examples:
                  - 100
                  default: 0
                currency:
                  type: string
                  description: The currency of the order
                  examples:
                  - sgd
                  default: sgd
                remark:
                  type: string
                  description: The remark of the order
                  examples:
