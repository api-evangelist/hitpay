meters:
- name: paynow_transaction_fee
  description: Per-transaction fee on PayNow collections (percentage + fixed, online or POS).
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - channel
  - method
- name: card_transaction_fee
  description: Per-transaction fee on domestic and international card charges (percentage + fixed).
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - card_region
  - channel
- name: ewallet_transaction_fee
  description: Per-transaction fee on GrabPay, WeChat Pay, Alipay, ShopeePay and other wallets.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - method
- name: fx_conversion_fee
  description: Additional conversion fee (~2%) applied to foreign-currency card transactions.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - currency
principles:
- name: Visibility
  description: Pull HitPay settlement/transaction reports; attribute fees per payment method and channel.
- name: Allocation
  description: Tag payment requests with reference_number to map transaction fees to orders and cost centers.
- name: Optimization
  description: Steer payers to PayNow (lowest fee in SG) over cards; avoid unnecessary FX by billing in local currency; reduce refunds/chargebacks since transaction fees are non-refundable.
- name: Accountability
  description: Review method-mix and effective fee rate monthly against revenue.
