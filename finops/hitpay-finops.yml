description: >-
  FinOps view of HitPay costs. HitPay charges no platform subscription fee for
  its core gateway; cost is driven purely by successful-transaction processing
  fees that vary by payment method (PayNow, cards, GrabPay, e-wallets, BNPL) and
  by online vs. in-person acceptance. There is no per-API-call software fee - the
  API is a means to initiate charges whose cost is the payment-processing fee.
notes: >-
  Because cost is a percentage-plus-fixed fee per transaction, cost management is
  primarily about routing to the cheapest acceptable method (PayNow is far
  cheaper than cards in Singapore) and minimizing refunds/chargebacks, since the
  original transaction fee is non-refundable. Verify current rates per market.
